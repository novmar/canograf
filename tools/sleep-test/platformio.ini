; Mereni klidoveho odberu desky po krocich.
;
; Samostatny projekt zamerne: nesaha do hlavniho firmwaru, nestavi
; LVGL ani panel, takze co bezi, je presne to, co je v main.cpp.
;
; Nahrani:
;   cd tools/sleep-test && pio run -t upload --upload-port /dev/ttyACM0
; Navrat k hlavnimu firmwaru:
;   cd ../.. && pio run -t upload --upload-port /dev/ttyACM0

[env:sleep-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
