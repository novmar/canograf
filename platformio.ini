; Talento HMI - Waveshare ESP32-S3-Touch-LCD-4.3B
;
; Verze jsou zamcene podle referencniho prikladu ESP32_Display_Panel
; (examples/platformio/lvgl_v8_port). Oficialni platforma espressif32
; neumi Arduino core 3.1.x, proto pioarduino. Balicek esp32-3.1.1-h.zip
; jsou vykonnostni knihovny, ktere resi "drifting" obrazu na RGB panelu
; u ESP32-S3 - bez nej obraz na teto desce ujizdi.

[platformio]
default_envs = waveshare43b
boards_dir = boards

[env:waveshare43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3_B

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Konfigurace projektu se NEDELA editaci tohoto souboru. Nasledujici
; skript slouci config/*.env (a tvuj local.env, neni-li, nevadi) a preda
; vysledek prekladaci jako -D makra. Na zacatku buildu vypise tabulku,
; ze ktere vrstvy kazda hodnota pochazi. Viz config/README.md.
extra_scripts = pre:scripts/build_config.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
; LVGL: lv_conf.h lezi v src/
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
; RGB panel nepotrebuje prohozeni bajtu barvy
    -DLV_COLOR_16_SWAP=0
; pouzij vestavenou definici teto desky misto vlastni
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3_B
    -I src

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
